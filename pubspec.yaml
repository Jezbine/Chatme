name: chatme
description: ChatMe - Messagerie instantanée Bénin (WhatsApp-like) avec appels, wallet FedaPay et moments.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & Navigation
  get: ^4.7.2

  # Backend - Supabase
  supabase_flutter: ^2.8.1

  # Firebase (FCM) + Notifications locales
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Deep links
  app_links: ^6.4.1

  # Auth / Security
  local_auth: ^2.3.0
  crypto: ^3.0.6
  permission_handler: ^11.3.1

  # Chat & Media
  image_picker: ^1.1.2
  record: ^6.1.1
  audioplayers: ^6.4.0
  video_player: ^2.8.6
  path_provider: ^2.1.5
  mobile_scanner: ^6.0.9
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.6
  intl: ^0.20.2

  # Calls - fix build error vidéoCodec null-safety sur Flutter 3.47 (2.5.4 bugué)
  livekit_client: 2.12.0

  # Offline & cache
  connectivity_plus: ^7.3.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  # Optional: flutter_svg pour icône vectorielle
  flutter_svg: ^2.0.14

  # Wallet
  feda_flutter: ^1.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# --- Icône de l'app générée depuis le SVG/PNG ---
# SVG source: assets/icons/app_icon.svg  (vectoriel, utilisé in-app via flutter_svg)
# PNG source pour launcher: assets/icons/app_icon.png (1024x1024, liquid glass)
# Lancer:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  image_path_android: "assets/icons/app_icon.png"
  image_path_ios: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#3C3489"
    theme_color: "#3C3489"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
