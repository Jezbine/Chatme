name: Build ChatMe (iOS IPA & Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS App (.ipa)
        run: |
          set -o pipefail
          touch build_ios.log
          cd ios
          pod install --repo-update || pod install || true
          cd ..

          # Prepare Flutter iOS build environment and assets
          flutter build ios --config-only --release --no-codesign 2>&1 | tee -a build_ios.log

          # Compile unsigned iOS release binary with xcodebuild using absolute paths
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/ios_derived" \
            SYMROOT="$PWD/build/ios_build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee -a build_ios.log

          # Package into .ipa
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find "$PWD/build/ios_build" -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching all build dirs for Runner.app..."
            APP_PATH=$(find "$PWD/build" -name "Runner.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found!"
            exit 1
          fi
          echo "Packaging $APP_PATH into ChatMe.ipa"
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q ChatMe.ipa Payload
          echo "### iOS IPA Build Successful! :iphone: :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "The .ipa file has been compiled and is ready for download in Artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatMe-iOS-IPA
          path: build/ios/ipa/ChatMe.ipa
          retention-days: 14

      - name: Save Debug Logs on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-ios-log
          git add -f build_ios.log
          git commit -m "ci: debug iOS build log" || true
          git push -f origin debug-ios-log || true

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          set -o pipefail
          touch build_android.log
          flutter build apk --release 2>&1 | tee build_android.log
          echo "### Android APK Build Successful! :robot: :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "The .apk file is ready for download in Artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatMe-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Save Debug Logs on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-android-log
          git add -f build_android.log
          git commit -m "ci: debug Android build log" || true
          git push -f origin debug-android-log || true
